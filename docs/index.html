<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Peace Soldiers • Peace Pass</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Persian-friendly font (optional, safe fallback) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      /* Approved “paper + soft watercolor” direction, with a bit more contrast */
      --bg: #f3efe7;
      --paper: #f7f2e9;
      --paper2:#fbf7f0;

      --ink: #171717;
      --muted:#5f5f5f;
      --soft:#7a7a7a;

      --line: rgba(0,0,0,.07);
      --stroke: rgba(0,0,0,.14);
      --card: rgba(255,255,255,.78);

      --shadow: 0 14px 34px rgba(0,0,0,.08);
      --shadow2: 0 8px 18px rgba(0,0,0,.06);

      --radius: 18px;
      --radius2: 14px;
      --pill: 999px;

      /* Accents (olive + warm gold, slightly richer) */
      --olive: #2f6d55;
      --olive2:#3e7c62;
      --gold:  #b18b3d;
      --gold2: #c59b4a;

      --btn: #141414;
      --btnText: #ffffff;

      /* Typography (smaller/minimal as requested) */
      --base: 13px;
      --h1: 30px;
      --h2: 18px;
      --h3: 14px;
      --small: 12px;
      --tiny: 11px;
    }

    *{ box-sizing:border-box; }
    html, body { height:100%; }
    body{
      margin:0;
      background: radial-gradient(1200px 600px at 30% -10%, rgba(47,109,85,.10), transparent 55%),
                  radial-gradient(900px 500px at 90% 10%, rgba(177,139,61,.10), transparent 60%),
                  var(--bg);
      color:var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      font-size: var(--base);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Persian */
    html[lang="fa"] body{
      font-family: "Vazirmatn", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      font-size: 14px; /* tiny bump for readability in FA */
    }

    a{ color: inherit; }
    .wrap{
      max-width: 980px;
      margin: 0 auto;
      padding: 18px 14px 90px;
    }

    /* “paper” container */
    .paper{
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(0,0,0,0) 0px,
          rgba(0,0,0,0) 26px,
          var(--line) 27px,
          rgba(0,0,0,0) 28px
        ),
        linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.35)),
        var(--paper);
      border: 1px solid rgba(0,0,0,.10);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .header{
      padding: 18px 18px 14px;
      border-bottom: 1px solid rgba(0,0,0,.10);
      position: relative;
    }

    .brandRow{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }

    .brand{
      display:flex;
      align-items:flex-start;
      gap:12px;
      min-width: 0;
    }

    .mark{
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(145deg, rgba(47,109,85,.18), rgba(177,139,61,.12));
      border: 1px solid rgba(0,0,0,.10);
      display:grid;
      place-items:center;
      flex: 0 0 auto;
      margin-top: 4px;
    }

    .mark span{
      font-weight: 700;
      color: var(--olive);
      letter-spacing: .5px;
    }

    .brandText{
      min-width:0;
    }

    .title{
      font-family: ui-serif, Georgia, "Times New Roman", Times, serif;
      font-size: var(--h1);
      line-height: 1.0;
      margin: 0;
      letter-spacing: .2px;
    }

    html[lang="fa"] .title{
      font-family: ui-serif, Georgia, "Times New Roman", Times, serif;
    }

    .subtitle{
      margin: 4px 0 0;
      color: var(--soft);
      font-size: var(--small);
      letter-spacing: .2px;
    }

    /* language toggle (fix: never hidden on mobile) */
    .langBox{
      display:flex;
      align-items:center;
      gap:8px;
      flex: 0 0 auto;
    }

    .langPills{
      display:flex;
      align-items:center;
      gap:6px;
      padding: 6px;
      border-radius: var(--pill);
      background: rgba(255,255,255,.55);
      border: 1px solid rgba(0,0,0,.10);
      box-shadow: var(--shadow2);
      white-space: nowrap;
    }

    .langBtn{
      border: 1px solid rgba(0,0,0,.14);
      background: rgba(255,255,255,.7);
      color: var(--ink);
      border-radius: var(--pill);
      padding: 6px 10px;
      font-size: var(--tiny);
      cursor:pointer;
      line-height: 1;
    }

    .langBtn.active{
      background: var(--btn);
      color: var(--btnText);
      border-color: rgba(0,0,0,.18);
    }

    .tabs{
      margin-top: 12px;
      display:flex;
      gap:8px;
      align-items:center;
      overflow:auto;
      padding-bottom: 6px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar{ display:none; }

    .tab{
      border: 1px solid rgba(0,0,0,.14);
      background: rgba(255,255,255,.62);
      border-radius: var(--pill);
      padding: 8px 12px;
      font-size: var(--small);
      cursor:pointer;
      white-space: nowrap;
      transition: transform .08s ease, background .15s ease;
      user-select:none;
    }
    .tab:active{ transform: scale(.98); }
    .tab.active{
      background: var(--btn);
      color: var(--btnText);
      border-color: rgba(0,0,0,.18);
    }

    .lead{
      margin-top: 10px;
      color: var(--muted);
      font-size: var(--small);
      line-height: 1.55;
    }

    .content{
      padding: 16px 18px 18px;
    }

    .grid{
      display:grid;
      grid-template-columns: 1.25fr .95fr;
      gap: 14px;
      align-items:start;
    }

    .card{
      background: var(--card);
      border: 1px solid rgba(0,0,0,.12);
      border-radius: var(--radius);
      box-shadow: var(--shadow2);
      padding: 14px;
    }

    .cardHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom: 10px;
    }

    .cardTitle{
      margin:0;
      font-size: var(--h2);
      letter-spacing: .2px;
      font-weight: 800;
    }
    html[lang="fa"] .cardTitle{ font-weight: 800; }

    .cardSub{
      margin: 6px 0 0;
      color: var(--muted);
      font-size: var(--small);
      line-height: 1.55;
    }

    .pillRow{
      display:flex;
      gap:8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .btn{
      border: 1px solid rgba(0,0,0,.16);
      background: rgba(255,255,255,.7);
      color: var(--ink);
      border-radius: var(--pill);
      padding: 10px 14px;
      font-size: var(--small);
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      user-select:none;
    }
    .btn.primary{
      background: var(--btn);
      color: var(--btnText);
      border-color: rgba(0,0,0,.18);
    }
    .btn.olive{
      background: rgba(47,109,85,.12);
      border-color: rgba(47,109,85,.25);
    }
    .btn.gold{
      background: rgba(177,139,61,.14);
      border-color: rgba(177,139,61,.30);
    }

    .mini{
      font-size: var(--tiny);
      color: var(--muted);
    }

    .hr{
      height: 1px;
      background: rgba(0,0,0,.10);
      margin: 12px 0;
    }

    .twoCol{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .label{
      font-size: var(--tiny);
      color: var(--muted);
      font-weight: 700;
    }

    input[type="number"], input[type="text"]{
      width:100%;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,.14);
      background: rgba(255,255,255,.75);
      padding: 10px 12px;
      font-size: var(--small);
      outline:none;
    }

    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap: wrap;
    }

    .badge{
      font-size: var(--tiny);
      border-radius: var(--pill);
      padding: 6px 10px;
      border: 1px solid rgba(0,0,0,.12);
      background: rgba(255,255,255,.65);
      color: var(--muted);
      white-space: nowrap;
    }
    .badge.good{
      background: rgba(47,109,85,.12);
      border-color: rgba(47,109,85,.25);
      color: var(--olive);
      font-weight: 800;
    }
    .badge.gold{
      background: rgba(177,139,61,.14);
      border-color: rgba(177,139,61,.28);
      color: var(--gold);
      font-weight: 800;
    }

    .progress{
      height: 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.08);
      overflow:hidden;
      border: 1px solid rgba(0,0,0,.10);
    }
    .progress > div{
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, rgba(177,139,61,.90), rgba(47,109,85,.80));
      border-radius: 999px;
    }

    .list{
      display:flex;
      flex-direction:column;
      gap: 10px;
      margin-top: 10px;
    }

    .item{
      border-radius: var(--radius);
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(0,0,0,.12);
      padding: 12px;
      box-shadow: 0 6px 14px rgba(0,0,0,.05);
    }

    .itemTop{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 10px;
    }

    .itemTitle{
      margin:0;
      font-weight: 900;
      font-size: 15px;
    }

    .itemDesc{
      margin: 8px 0 0;
      color: var(--muted);
      font-size: var(--small);
      line-height: 1.55;
    }

    .meta{
      display:flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .actions{
      display:flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .footerNote{
      margin-top: 14px;
      color: var(--muted);
      font-size: var(--tiny);
      line-height: 1.6;
    }

    /* bottom nav (mobile-first, keeps UX simple) */
    .bottomNav{
      position: fixed;
      left: 0; right: 0; bottom: 0;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: rgba(243,239,231,.88);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(0,0,0,.10);
      z-index: 50;
    }

    .navInner{
      max-width: 980px;
      margin: 0 auto;
      display:flex;
      justify-content:space-between;
      gap: 8px;
    }

    .navBtn{
      flex: 1 1 0;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,.12);
      background: rgba(255,255,255,.62);
      padding: 10px 8px;
      font-size: var(--tiny);
      cursor:pointer;
      text-align:center;
      user-select:none;
      white-space: nowrap;
    }
    .navBtn.active{
      background: var(--btn);
      color: var(--btnText);
      border-color: rgba(0,0,0,.18);
      font-weight: 800;
    }

    /* responsive */
    @media (max-width: 860px){
      .grid{ grid-template-columns: 1fr; }
      .title{ font-size: 34px; }
    }
    @media (max-width: 520px){
      .wrap{ padding: 12px 10px 92px; }
      .header{ padding: 14px 14px 12px; }
      .content{ padding: 14px; }
      .title{ font-size: 36px; }
      .subtitle{ font-size: 12px; }
      .tab{ padding: 9px 12px; }
      .card{ padding: 13px; }
      .cardTitle{ font-size: 18px; }
    }

    /* RTL adjustments */
    html[dir="rtl"] .brandRow{ direction: rtl; }
    html[dir="rtl"] .tabs{ direction: rtl; }
    html[dir="rtl"] .navInner{ direction: rtl; }
    html[dir="rtl"] .row{ direction: rtl; }
    html[dir="rtl"] .itemTop{ direction: rtl; }

    /* small helper */
    .muted{ color: var(--muted); }
    .kpi{
      font-size: 40px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: .2px;
    }
  </style>
</head>

      function t(key){
        const pack = I18N[state.lang] || I18N.en;
        return pack[key] || I18N.en[key] || key;
      }

      function setLang(lang){
        state.lang = (lang === "fa") ? "fa" : "en";
        localStorage.setItem("ps_lang", state.lang);

        document.documentElement.lang = state.lang;
        document.documentElement.dir = (state.lang === "fa") ? "rtl" : "ltr";

        // update language buttons
        document.getElementById("btnEN").classList.toggle("active", state.lang === "en");
        document.getElementById("btnFA").classList.toggle("active", state.lang === "fa");

        // update static i18n nodes
        document.querySelectorAll("[data-i18n]").forEach(el=>{
          const key = el.getAttribute("data-i18n");
          el.textContent = t(key);
        });

        // rebuild UI
        buildTabs();
        buildBottomNav();
        renderRoute(state.route);
      }

      function detectLang(){
        const saved = localStorage.getItem("ps_lang");
        if (saved === "fa" || saved === "en") return saved;

        let code = "en";
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code){
          code = tg.initDataUnsafe.user.language_code || "en";
        } else if (navigator.language){
          code = navigator.language;
        }

        const lc = String(code).toLowerCase();
        if (lc.startsWith("fa") || lc.includes("ir")) return "fa";
        return "en";
      }

      function hydrateUser(){
        const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
        if (!u) return;

        state.user = {
          first_name: u.first_name || "Guest",
          last_name: u.last_name || "",
          username: u.username || "guest",
          id: u.id || 0,
          language_code: u.language_code || "en"
        };

        const full = [state.user.first_name, state.user.last_name].filter(Boolean).join(" ").trim();
        if (full) state.profile.fullName = full;

        if (state.user.id) {
          // demo format
          const s = String(state.user.id).padStart(10, "0").slice(-10);
          state.profile.peaceId = "PS-" + s;
        }
      }

      function bindInternalLinks(root){
        root.querySelectorAll("[data-go]").forEach(btn=>{

            const r = btn.getAttribute("data-go");
            if (r) go(r);
          });
        });

      function renderRoute(route){
        state.route = route;
        buildTabs();
        buildBottomNav();

        const content = document.getElementById("content");
        content.innerHTML = "";

        let node = null;
        switch(route){
          case "home": node = pageHome(); break;
          case "pass": node = pagePass(); break;
          case "missions": node = pageMissions(); break;
          case "airdrop": node = pageAirdrop(); break;
          case "store": node = pageStore(); break;
          case "news": node = pageNews(); break;
          case "about": node = pageAbout(); break;
          case "partners": node = pagePartners(); break;
          case "docs": node = pageDocs(); break;
          case "token": node = pageToken(); break;
          case "nft": node = pageNFT(); break;
          default: node = pageHome();
        }

        content.appendChild(node);
        bindInternalLinks(content);

        // home converter interactions
        const peaceInput = document.getElementById("peaceAmount");
        const usdtInput  = document.getElementById("usdtAmount");
        if (peaceInput && usdtInput){
          const calc = ()=>{
            const v = Math.max(0, Number(peaceInput.value || 0));
            const out = (v * state.rate);
            usdtInput.value = out.toFixed(2);
          };
          peaceInput.addEventListener("input", calc);
          calc();
        }

        const convertBtnTop = document.getElementById("convertBtnTop");
        if (convertBtnTop){
          convertBtnTop.addEventListener("click", ()=>{
            try{
              if (tg) tg.showPopup({
                title: state.lang==="fa" ? "تبدیل (دمو)" : "Convert (Demo)",
                message: state.lang==="fa"
                  ? "این بخش فعلاً پیش‌نمایش است. اتصال کیف‌پول و تبدیل واقعی در فاز بعد اضافه می‌شود."
                  : "This is a preview. Wallet connection and real swaps will be added later.",
                buttons: [{type:"ok"}]
              });
              else alert(state.lang==="fa" ? "دمو: تبدیل واقعی در فاز بعد اضافه می‌شود." : "Demo: real swap will be added later.");
            }catch(e){
              alert(state.lang==="fa" ? "دمو: تبدیل واقعی در فاز بعد اضافه می‌شود." : "Demo: real swap will be added later.");
            }
          });
        }
      }

      // language buttons
      document.getElementById("btnEN").addEventListener("click", ()=> setLang("en"));
      document.getElementById("btnFA").addEventListener("click", ()=> setLang("fa"));

      // boot
      hydrateUser();
      const initialLang = detectLang();
      setLang(initialLang);

      function onHash(){
        const r = currentHash();
        renderRoute(r);
      }
      window.addEventListener("hashchange", onHash);
      onHash();
    })();
  </script>
</body>
</html>
