<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Peace Soldiers — Mini App</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root{
      /* Theme */
      --bg: #f4efe6;
      --paper: #fbf8f1;
      --paper2: #f7f2e8;
      --ink: #171717;
      --muted: #5f5d57;
      --line: rgba(0,0,0,.10);
      --shadow: 0 14px 40px rgba(0,0,0,.08);
      --shadow2: 0 8px 20px rgba(0,0,0,.06);
      --radius: 18px;

      --btn: #111111;
      --btnText: #ffffff;

      --accent: #b08a3c;   /* gold */
      --accent2: #6e7f4a;  /* olive */
      --good: #2f7a49;

      --tile: rgba(255,255,255,.78);
      --tileBorder: rgba(0,0,0,.10);

      /* Typography (smaller/minimal) */
      --base: 14px;
      --h1: 44px;
      --sub: 14px;
      --h2: 18px;
      --h3: 15px;
      --p: 13px;
      --small: 12px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      font-size: var(--base);
      color: var(--ink);
      background:
        radial-gradient(1200px 900px at 20% -10%, rgba(176,138,60,.10), transparent 55%),
        radial-gradient(900px 700px at 100% 20%, rgba(110,127,74,.10), transparent 52%),
        linear-gradient(180deg, var(--bg), #f1ecdf);
    }

    .grain:before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background-image:
        repeating-linear-gradient(0deg, rgba(0,0,0,.022) 0 1px, transparent 1px 22px),
        repeating-linear-gradient(90deg, rgba(0,0,0,.016) 0 1px, transparent 1px 28px);
      mix-blend-mode:multiply;
      opacity:.33;
    }

    a{ color:inherit; text-decoration:none; }
    button{ font:inherit; cursor:pointer; }

    .wrap{
      max-width: 980px;
      margin: 18px auto;
      padding: 0 14px 40px;
    }

    .card{
      background: linear-gradient(180deg, var(--paper), var(--paper2));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow2);
    }

    /* Header */
    .hero{
      padding: 16px 16px 12px;
      border-radius: 22px;
      box-shadow: var(--shadow);
      position: relative;
      overflow:hidden;
    }
    .hero:after{
      content:"";
      position:absolute;
      inset:0;
      background: radial-gradient(600px 220px at 50% 0%, rgba(255,255,255,.75), transparent 62%);
      pointer-events:none;
      opacity:.85;
    }
    .heroInner{ position:relative; z-index:1; }

    .brandRow{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 10px;
    }

    .brand{
      line-height:1.02;
      padding-top: 2px;
      min-width: 0;
    }
    .brand h1{
      margin:0;
      font-family: ui-serif, Georgia, "Times New Roman", Times, serif;
      font-size: var(--h1);
      letter-spacing: .4px;
    }
    .brand .sub{
      margin-top: 4px;
      font-family: ui-serif, Georgia, "Times New Roman", Times, serif;
      color: rgba(0,0,0,.55);
      font-size: var(--sub);
    }

    .topActions{
      display:flex;
      align-items:center;
      gap:10px;
      margin-top: 4px;
      flex: 0 0 auto;
    }

    .langSwitch{
      display:flex;
      gap:8px;
      align-items:center;
      justify-content:flex-end;
    }

    .pillBtn{
      border:1px solid rgba(0,0,0,.22);
      background: rgba(255,255,255,.65);
      color: var(--ink);
      padding: 7px 11px;
      border-radius: 999px;
      font-weight: 800;
      font-size: var(--small);
      min-width: 42px;
      text-align:center;
      backdrop-filter: blur(6px);
    }
    .pillBtn.active{
      background: var(--btn);
      color: var(--btnText);
      border-color: transparent;
      box-shadow: 0 8px 18px rgba(0,0,0,.12);
    }

    .nav{
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(0,0,0,.08);
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      justify-content:center;
    }

    .navBtn{
      border: 1px solid rgba(0,0,0,.26);
      background: rgba(255,255,255,.65);
      color: var(--ink);
      padding: 9px 12px;
      border-radius: 999px;
      font-weight: 800;
      font-size: var(--small);
      backdrop-filter: blur(6px);
    }
    .navBtn.active{
      background: var(--btn);
      color: var(--btnText);
      border-color: transparent;
    }

    .heroNote{
      margin-top: 9px;
      text-align:center;
      color: rgba(0,0,0,.55);
      font-size: var(--small);
      max-width: 860px;
      margin-left:auto;
      margin-right:auto;
      line-height: 1.6;
    }

    /* Layout */
    .grid{
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 14px;
      margin-top: 14px;
    }

    .section{
      padding: 16px;
    }
    .section h2{
      margin:0 0 8px;
      font-size: var(--h2);
      letter-spacing: .2px;
      font-weight: 900;
    }
    .section h3{
      margin:0;
      font-size: var(--h3);
      font-weight: 900;
    }
    .muted{ color: var(--muted); }
    .p{
      font-size: var(--p);
      font-weight: 650;
      line-height: 1.75;
      margin: 0;
    }
    .hr{ height:1px; background: rgba(0,0,0,.08); margin: 12px 0; }

    /* Snapshot */
    .snapshot{
      padding: 13px;
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,.08);
      background: rgba(255,255,255,.55);
    }
    .snapTop{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
    }
    .avatar{
      width: 54px;
      height: 54px;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,.12);
      background: linear-gradient(180deg, rgba(0,0,0,.06), rgba(0,0,0,.02));
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 900;
      color: rgba(0,0,0,.55);
      flex: 0 0 auto;
      overflow:hidden;
    }
    .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }

    .snapInfo{
      flex:1;
      min-width: 0;
      padding-inline: 6px;
    }
    .snapName{
      font-size: 15px;
      font-weight: 900;
      margin: 0 0 3px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .snapMeta{
      font-size: var(--small);
      color: rgba(0,0,0,.62);
      display:flex;
      flex-wrap:wrap;
      gap:6px 8px;
      align-items:center;
      font-weight: 750;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.12);
      background: rgba(255,255,255,.55);
      font-size: var(--small);
      font-weight: 850;
    }
    .level{ color: var(--good); font-weight: 950; }

    .progressRow{
      margin-top: 9px;
      display:flex;
      align-items:center;
      gap: 10px;
    }
    .bar{
      height: 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.08);
      overflow:hidden;
      border: 1px solid rgba(0,0,0,.10);
      flex:1;
    }
    .bar > div{
      height:100%;
      width: 45%;
      background: linear-gradient(90deg, var(--accent), rgba(176,138,60,.55));
      border-radius: 999px;
    }
    .pct{
      font-weight: 900;
      color: rgba(0,0,0,.65);
      font-size: var(--small);
      min-width: 42px;
      text-align:right;
    }

    /* Convert (improved) */
    .actionCard{
      padding: 14px;
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,.08);
      background:
        radial-gradient(260px 120px at 95% 15%, rgba(176,138,60,.12), transparent 62%),
        radial-gradient(260px 120px at 15% 85%, rgba(110,127,74,.10), transparent 62%),
        rgba(255,255,255,.60);
      display:flex;
      gap: 12px;
      align-items:stretch;
      justify-content:space-between;
    }
    .actionLeft{ min-width:0; flex:1; }
    .actionTitle{
      font-weight: 950;
      font-size: 16px;
      margin:0 0 8px;
      letter-spacing:.2px;
    }

    .convertGrid{
      display:grid;
      grid-template-columns: 1fr 44px 1fr;
      gap: 10px;
      align-items:end;
      margin-top: 10px;
    }
    .swapBtn{
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,.16);
      background: rgba(255,255,255,.75);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 950;
    }

    .field label{
      display:block;
      font-size: var(--small);
      color: rgba(0,0,0,.55);
      margin-bottom: 6px;
      font-weight: 800;
    }
    .field .row{
      display:flex;
      gap: 8px;
    }
    .select{
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,.12);
      background: rgba(255,255,255,.85);
      padding: 10px 10px;
      font-weight: 900;
      min-width: 86px;
      outline:none;
    }
    .field input{
      width:100%;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,.12);
      background: rgba(255,255,255,.85);
      padding: 10px 10px;
      outline:none;
      font-weight: 900;
      color: var(--ink);
    }
    .field input:focus{
      box-shadow: 0 0 0 3px rgba(176,138,60,.16);
      border-color: rgba(176,138,60,.45);
    }

    .quickRow{
      margin-top: 10px;
      display:flex;
      gap: 8px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-start;
    }
    .chip{
      border: 1px solid rgba(0,0,0,.18);
      background: rgba(255,255,255,.70);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: var(--small);
      font-weight: 900;
    }

    .miniNote{
      margin-top: 10px;
      font-size: var(--small);
      color: rgba(0,0,0,.55);
      display:flex;
      gap: 8px;
      align-items:center;
      justify-content:flex-start;
      font-weight: 750;
    }

    .cta{
      border-radius: 999px;
      padding: 11px 14px;
      border: 1px solid rgba(0,0,0,.12);
      background: var(--btn);
      color: var(--btnText);
      font-weight: 950;
      white-space:nowrap;
      font-size: var(--small);
    }
    .cta.secondary{
      background: rgba(255,255,255,.75);
      color: var(--ink);
      border: 1px solid rgba(0,0,0,.24);
      font-weight: 900;
    }

    /* Tiles */
    .tiles{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }
    .tile{
      border-radius: 16px;
      border: 1px solid var(--tileBorder);
      background: var(--tile);
      padding: 12px;
      min-height: 74px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .tile h3{ margin:0; font-size: 14px; font-weight: 950; }
    .tile p{ margin:6px 0 0; font-size: var(--small); color: rgba(0,0,0,.60); font-weight: 800; }

    /* Lists */
    .list{ display:grid; gap: 12px; }
    .item{
      padding: 14px;
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,.10);
      background: rgba(255,255,255,.60);
    }
    .itemTop{
      display:flex;
      gap: 10px;
      justify-content:space-between;
      align-items:flex-start;
    }
    .tag{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.12);
      background: rgba(255,255,255,.55);
      font-size: var(--small);
      font-weight: 950;
      color: rgba(0,0,0,.68);
      white-space:nowrap;
    }
    .item p{
      margin: 8px 0 0;
      color: rgba(0,0,0,.62);
      font-size: var(--p);
      line-height: 1.6;
      font-weight: 650;
    }
    .metaRow{
      margin-top: 12px;
      display:flex;
      gap: 8px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-start;
    }
    .metaPill{
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.12);
      background: rgba(255,255,255,.65);
      font-size: var(--small);
      font-weight: 950;
      color: rgba(0,0,0,.62);
    }
    .btnRow{
      margin-top: 12px;
      display:flex;
      gap: 10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .footer{
      margin-top: 14px;
      text-align:center;
      color: rgba(0,0,0,.45);
      font-size: var(--small);
      padding: 8px 0 0;
      font-weight: 750;
    }

    /* Passport detail blocks */
    .featureGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }
    .feature{
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,.10);
      background: rgba(255,255,255,.58);
    }
    .feature .k{ font-size: var(--small); color: rgba(0,0,0,.55); font-weight: 850; }
    .feature .v{ margin-top: 6px; font-size: 13px; font-weight: 850; line-height: 1.6; }

    .steps{
      display:grid;
      gap: 10px;
      margin-top: 12px;
    }
    .step{
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,.10);
      background: rgba(255,255,255,.58);
      display:flex;
      gap: 10px;
      align-items:flex-start;
    }
    .num{
      width: 26px;
      height: 26px;
      border-radius: 10px;
      background: rgba(176,138,60,.18);
      border: 1px solid rgba(176,138,60,.28);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 950;
      font-size: var(--small);
      flex: 0 0 auto;
    }
    .step .title{ font-weight: 950; font-size: 13px; }
    .step .desc{ margin-top: 4px; font-size: var(--p); color: rgba(0,0,0,.62); font-weight: 650; line-height: 1.6; }

    /* Responsive */
    @media (max-width: 820px){
      :root{ --h1: 40px; }
      .grid{ grid-template-columns: 1fr; }
    }
    @media (max-width: 520px){
      .wrap{ margin: 12px auto; padding: 0 12px 30px; }
      :root{ --h1: 38px; }
      .convertGrid{ grid-template-columns: 1fr; }
      .swapBtn{ width: 100%; }
      .cta{ width: 100%; text-align:center; }
      .cta.secondary{ width:auto; }
      .featureGrid{ grid-template-columns: 1fr; }
    }

    /* RTL */
    [dir="rtl"] body{ font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    [dir="rtl"] .brand{ text-align:right; }
    [dir="rtl"] .heroNote{ direction: rtl; }
    [dir="rtl"] .snapMeta{ direction: rtl; }
    [dir="rtl"] .btnRow{ justify-content:flex-start; }
  </style>
</head>

    // ---------- Safe storage (Telegram WebView can block localStorage) ----------
    const SafeStore = (() => {
      let mem = {};
      function get(k){
        try { return localStorage.getItem(k); } catch(e){ return (k in mem) ? mem[k] : null; }
      }
      function set(k,v){
        try { localStorage.setItem(k,v); }
        catch(e){ mem[k]=String(v); }
      }
      return { get, set };
    })();

    // ---------- Telegram user ----------
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) { try { tg.ready(); } catch(e){} }

    const init = (tg && tg.initDataUnsafe) ? tg.initDataUnsafe : {};
    const tgUser = init.user || null;

    const user = tgUser ? {
      id: tgUser.id,
      username: tgUser.username || "",
      first_name: tgUser.first_name || "",
      last_name: tgUser.last_name || "",
      language_code: tgUser.language_code || "en",
      photo_url: tgUser.photo_url || ""
    } : {
      id: 12345678,
      username: "guest",
      first_name: "Guest",
      last_name: "",
      language_code: "en",
      photo_url: ""
    };

    function computePeaceId(id){
      const n = String(id || 0).replace(/\D/g,"");
      return "PS-" + n.padStart(10,"0");
    }

    function openLink(url){
      if (!url) return;
      try {
        if (tg && tg.openLink) tg.openLink(url);
        else window.open(url, "_blank", "noopener,noreferrer");
      } catch(e){
        window.open(url, "_blank");
      }
    }

        <div class="grid">
          <div class="card section" style="grid-column: 1 / -1;">
            <h2>${t("missions_title")}</h2>
            <p class="p muted">${t("missions_desc")}</p>

        </div>

    }

        return arr.map(x => `
          <div class="item">

              <div>
                <h3>${x.name}</h3>

    function pageToken(){
      return `

            <div class="featureGrid">
              <div class="feature">
                <div class="k">${t("tge")}</div>
                <div class="v">
                  ${lang==="fa" ? "تاریخ" : "Date"}: <b>${CONFIG.token.tgeDate}</b><br/>
                  ${lang==="fa" ? "شبکه" : "Chain"}: <b>${CONFIG.token.chain}</b><br/>
                  ${lang==="fa" ? "نماد" : "Symbol"}: <b>${CONFIG.token.symbol}</b>
                </div>
              </div>
              <div class="feature">
                <div class="k">${t("tokenomics")}</div>
                <div class="v">
                  ${lang==="fa" ? "عرضه کل" : "Total supply"}: <b>${CONFIG.token.totalSupply}</b><br/>
                  ${lang==="fa"
                    ? "جزئیات کامل در فایل Tokenomics ارائه می‌شود."
                    : "Full details are provided in the Tokenomics document."}
                </div>
              </div>
            </div>

            <div class="hr"></div>

            <div class="item">
              <div class="itemTop">
                <div>
                  <h3>${lang==="fa" ? "کاربردهای کلیدی" : "Key utilities"}</h3>
                  <p>${lang==="fa"
                    ? "توکن برای هماهنگی، پاداش‌دهی، دسترسی و مکانیزم‌های اقتصادی طراحی می‌شود. اولویت با شفافیت، قواعد روشن و تجربه کاربری ساده است."
                    : "The token supports coordination, incentives, access rules, and economic mechanisms. Priority is clarity, transparent rules, and a simple UX."}</p>
                </div>
                <div class="tag">Utility</div>
              </div>

              <div class="btnRow">
                <button class="cta" data-open="tokenomics">${t("open_tokenomics")}</button>
                <button class="cta secondary" data-open="whitepaper">${t("open_whitepaper")}</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function pageContent(){
      const p = currentPage();
      if (p==="home") return pageHome();
      if (p==="pass") return pagePass();
      if (p==="missions") return pageMissions();
      if (p==="airdrop") return pageAirdrop();
      if (p==="store") return pageStore();
      if (p==="news") return pageNews();
      if (p==="about") return pageAbout();
      if (p==="docs") return pageDocs();
      if (p==="nft") return pageNFT();
      if (p==="partners") return pagePartners();
      if (p==="token") return pageToken();
      return pageHome();
    }

    function render(){
      applyDir();
      const app = document.getElementById("app");
      app.innerHTML = header() + pageContent();

      // Nav
      app.querySelectorAll("[data-go]").forEach(b=>{
        b.addEventListener("click", ()=> go(b.getAttribute("data-go")));
      });

      // Language
      app.querySelectorAll("[data-lang]").forEach(b=>{
        b.addEventListener("click", ()=> setLang(b.getAttribute("data-lang")));
      });

      // Open links
      app.querySelectorAll("[data-open]").forEach(b=>{
        b.addEventListener("click", ()=>{
          const k = b.getAttribute("data-open");
          openLink(CONFIG.links[k]);
        });
      });
      app.querySelectorAll("[data-link]").forEach(b=>{
        b.addEventListener("click", ()=> openLink(b.getAttribute("data-link")));
      });

      // Convert demo logic
      const fromAsset = document.getElementById("fromAsset");
      const toAsset = document.getElementById("toAsset");
      const fromAmount = document.getElementById("fromAmount");
      const toAmount = document.getElementById("toAmount");
      const swapBtn = document.getElementById("swapBtn");
      const convertBtn = document.getElementById("convertBtn");

      const rate = 0.78; // sample
      function recalc(){
        if (!fromAsset || !toAsset || !fromAmount || !toAmount) return;
        const v = parseFloat(String(fromAmount.value||"0").replace(/,/g,".")) || 0;

        if (fromAsset.value === "PEACE" && toAsset.value === "USDT"){
          toAmount.value = (v * rate).toFixed(2);
        } else if (fromAsset.value === "USDT" && toAsset.value === "PEACE"){
          toAmount.value = rate === 0 ? "0" : (v / rate).toFixed(2);
        } else {
          toAmount.value = v.toFixed(2);
        }
      }

      if (fromAsset && toAsset){
        fromAsset.addEventListener("change", recalc);
        toAsset.addEventListener("change", recalc);
      }
      if (fromAmount) fromAmount.addEventListener("input", recalc);

      if (swapBtn && fromAsset && toAsset){
        swapBtn.addEventListener("click", ()=>{
          const a = fromAsset.value;
          fromAsset.value = toAsset.value;
          toAsset.value = a;
          recalc();
        });
      }

      app.querySelectorAll("[data-quick]").forEach(b=>{
        b.addEventListener("click", ()=>{
          if (!fromAmount) return;
          fromAmount.value = b.getAttribute("data-quick");
          recalc();
        });
      });

      if (convertBtn){
        convertBtn.addEventListener("click", ()=>{
          const msg = (lang==="fa") ? "این بخش در نسخه فعلی نمایشی است." : "This action is preview-only in this build.";
          try { if (tg) tg.showPopup({ title:"Peace Soldiers", message: msg, buttons:[{type:"ok"}] }); }
          catch(e){ alert(msg); }
        });
      }

      // Airdrop demo
      const eligBtn = document.getElementById("eligBtn");
      if (eligBtn){
        eligBtn.addEventListener("click", ()=>{
          const msg = (lang==="fa")
            ? "نتیجه در این نسخه نمایشی است. در نسخه کامل، شرایط با ماموریت‌ها و تایید اثرگذاری مشخص می‌شود."
            : "Result is demo-only. In the full version, eligibility depends on missions and verified impact.";
          try { if (tg) tg.showPopup({ title:"Airdrop", message: msg, buttons:[{type:"ok"}] }); }
          catch(e){ alert(msg); }
        });
      }

      // Mission actions
      app.querySelectorAll("[data-join]").forEach(b=>{
        b.addEventListener("click", ()=>{
          const id = b.getAttribute("data-join");
          const msg = (lang==="fa") ? `شروع ماموریت (${id}) در این نسخه نمایشی است.` : `Joining mission (${id}) is demo-only.`;
          try { if (tg) tg.showPopup({ title:"Missions", message: msg, buttons:[{type:"ok"}] }); }
          catch(e){ alert(msg); }
        });
      });
      app.querySelectorAll("[data-details]").forEach(b=>{
        b.addEventListener("click", ()=>{
          const id = b.getAttribute("data-details");
          const m = missions.find(x=>x.id===id);
          const msg = m ? (lang==="fa" ? m.desc_fa : m.desc_en) : (lang==="fa" ? "جزئیات یافت نشد." : "Details not found.");
          try { if (tg) tg.showPopup({ title: id, message: msg, buttons:[{type:"ok"}] }); }
          catch(e){ alert(msg); }
        });
      });

      // Store redeem demo
      app.querySelectorAll("[data-redeem]").forEach(b=>{
        b.addEventListener("click", ()=>{
          const sku = b.getAttribute("data-redeem");
          const msg = (lang==="fa") ? `دریافت (${sku}) در این نسخه نمایشی است.` : `Redeem (${sku}) is demo-only.`;
          try { if (tg) tg.showPopup({ title:"Store", message: msg, buttons:[{type:"ok"}] }); }
          catch(e){ alert(msg); }
        });
      });

      recalc();
    }

    window.addEventListener("hashchange", render);
    render();
  </script>
